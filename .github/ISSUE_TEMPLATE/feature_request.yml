name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the operator-visible result.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Cover robot motion, calibration, data migration, and existing programs.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
